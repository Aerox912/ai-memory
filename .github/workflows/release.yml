name: release

# Triggered when a version tag is pushed, e.g. git push origin v1.29.1-aerox.4.
# This workstation fork intentionally publishes only the native products used
# here: Linux x86_64 for WSL and Windows x86_64.
#
# The CI workflows validate the source separately. This workflow builds,
# smoke-tests, attests, and publishes the selected native release assets.
on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validate-version:
    name: validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(awk -F ' *= *' '
            /^\[workspace.package\]$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" {
              gsub(/"/, "", $2);
              print $2;
              exit;
            }
          ' Cargo.toml)"
          if [ -z "$manifest_version" ]; then
            echo "could not read [workspace.package].version from Cargo.toml" >&2
            exit 1
          fi
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "tag version v${tag_version} does not match Cargo.toml version ${manifest_version}" >&2
            exit 1
          fi
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"
          if [[ "$tag_version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  binary:
    name: linux ${{ matrix.arch }} binary
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            artifact: ai-memory-linux-x86_64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release binary
        env:
          TAILWIND_SKIP: "1"
        run: cargo build --locked --release -p ai-memory-cli

      - name: Create release tarball
        env:
          RELEASE_ARTIFACT: ${{ matrix.artifact }}
        run: |
          artifact="$RELEASE_ARTIFACT"
          mkdir -p "dist/$artifact"
          cp target/release/ai-memory "dist/$artifact/ai-memory"
          cp -a hooks "dist/$artifact/hooks"
          mkdir -p "dist/$artifact/packaging"
          cp -a packaging/systemd "dist/$artifact/packaging/systemd"
          cp -a packaging/sysusers "dist/$artifact/packaging/sysusers"
          cp -a packaging/tmpfiles "dist/$artifact/packaging/tmpfiles"
          cp -a packaging/env "dist/$artifact/packaging/env"
          mkdir -p "dist/$artifact/crates/ai-memory-cli/templates"
          cp crates/ai-memory-cli/templates/config.default.toml \
            "dist/$artifact/crates/ai-memory-cli/templates/config.default.toml"
          mkdir -p "dist/$artifact/docs"
          cp README.md LICENSE "dist/$artifact/"
          cp docs/install.md "dist/$artifact/docs/install.md"
          tar -C "dist/$artifact" -czf "$artifact.tar.gz" .
          sha256sum "$artifact.tar.gz" > "$artifact.tar.gz.sha256"

      - name: Smoke test release tarball
        env:
          RELEASE_ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          artifact="$RELEASE_ARTIFACT"
          smoke="dist/smoke-$artifact"
          mkdir -p "$smoke"
          tar -xzf "$artifact.tar.gz" -C "$smoke"
          "$smoke/ai-memory" --version
          for path in \
            hooks \
            crates/ai-memory-cli/templates/config.default.toml \
            docs/install.md \
            README.md \
            LICENSE
          do
            test -e "$smoke/$path" || { echo "Linux release tarball missing $path" >&2; exit 1; }
          done
          grep -Eq "^[0-9a-f]{64}  $artifact\.tar\.gz$" "$artifact.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  windows:
    name: windows x86_64 binary
    needs: validate-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release binary
        env:
          TAILWIND_SKIP: "1"
        run: cargo build --locked --release -p ai-memory-cli

      # Mirrors the Linux tarball, minus the Linux-only service assets
      # (packaging/systemd|sysusers|tmpfiles|env). Ships the `.exe`, the full
      # hooks bundle (the .ps1 + .sh scripts), the default config template, and
      # the docs a Windows user needs (install.md + windows.md). Zipped (native
      # Windows archive) with a sha256sum-format checksum so the release body's
      # checksums block stays uniform across platforms.
      - name: Create release zip
        shell: pwsh
        env:
          RELEASE_ARTIFACT: ai-memory-windows-x86_64
        run: |
          $artifact = $env:RELEASE_ARTIFACT
          $stage = "dist/$artifact"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/ai-memory.exe "$stage/ai-memory.exe"
          Copy-Item -Recurse hooks "$stage/hooks"
          New-Item -ItemType Directory -Force -Path "$stage/crates/ai-memory-cli/templates" | Out-Null
          Copy-Item crates/ai-memory-cli/templates/config.default.toml `
            "$stage/crates/ai-memory-cli/templates/config.default.toml"
          New-Item -ItemType Directory -Force -Path "$stage/docs" | Out-Null
          Copy-Item README.md, LICENSE $stage
          Copy-Item docs/install.md "$stage/docs/install.md"
          Copy-Item docs/windows.md "$stage/docs/windows.md"
          $zip = "$artifact.zip"
          # Pipe the staged items in (rather than a "$stage/*" glob) so the
          # archive is rooted at the files themselves — ai-memory.exe, hooks/,
          # etc. land at the zip root, mirroring the Linux tarball layout.
          Get-ChildItem $stage | Compress-Archive -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Smoke test release zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "ai-memory-windows-x86_64.zip"
          $smoke = "dist/smoke-windows-zip"
          Expand-Archive $zip -DestinationPath $smoke -Force
          & "$smoke/ai-memory.exe" --version
          foreach ($path in @(
            "hooks",
            "crates/ai-memory-cli/templates/config.default.toml",
            "docs/install.md",
            "docs/windows.md",
            "README.md",
            "LICENSE"
          )) {
            if (-not (Test-Path "$smoke/$path")) {
              throw "Windows release zip missing $path"
            }
          }
          $checksum = Get-Content "$zip.sha256" -Raw
          if ($checksum -notmatch '^[0-9a-f]{64}  ai-memory-windows-x86_64\.zip\r?\n?$') {
            throw "Windows release zip checksum is not sha256sum format"
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-memory-windows-x86_64
          path: |
            ai-memory-windows-x86_64.zip
            ai-memory-windows-x86_64.zip.sha256

  github-release:
    name: github release
    needs: [binary, windows, validate-version]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ai-memory-*
          path: artifacts
          merge-multiple: true

      - name: Stage checksum-verified wrapper assets
        run: |
          set -euo pipefail
          install -m 0755 bin/ai-memory artifacts/ai-memory-wrapper
          install -m 0644 bin/ai-memory.ps1 artifacts/ai-memory-wrapper.ps1
          install -m 0644 bin/ai-memory.cmd artifacts/ai-memory-wrapper.cmd
          (
            cd artifacts
            sha256sum ai-memory-wrapper > ai-memory-wrapper.sha256
            sha256sum ai-memory-wrapper.ps1 > ai-memory-wrapper.ps1.sha256
            sha256sum ai-memory-wrapper.cmd > ai-memory-wrapper.cmd.sha256
          )

      - name: Stage checksum-verified hook installer assets
        run: |
          set -euo pipefail
          install -m 0755 scripts/install-hooks.sh artifacts/ai-memory-install-hooks
          tar -czf artifacts/ai-memory-hooks.tar.gz hooks
          (
            cd artifacts
            sha256sum ai-memory-install-hooks > ai-memory-install-hooks.sha256
            sha256sum ai-memory-hooks.tar.gz > ai-memory-hooks.tar.gz.sha256
          )

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/ai-memory-source.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksum and attest release assets
        run: |
          set -euo pipefail
          (
            cd artifacts
            sha256sum ai-memory-source.spdx.json > ai-memory-source.spdx.json.sha256
          )

      - name: Attest release asset provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*

      - name: Generate release body
        run: |
          echo "## Checksums (SHA256)" > body.md
          echo '```' >> body.md
          cat artifacts/*.sha256 >> body.md
          echo '```' >> body.md
          echo "" >> body.md
          echo "## Install" >> body.md
          echo '```bash' >> body.md
          echo "# WSL/Linux x86_64: download ai-memory-linux-x86_64.tar.gz below" >> body.md
          echo "# Windows x86_64: download ai-memory-windows-x86_64.zip below" >> body.md
          echo "" >> body.md
          echo "# From source" >> body.md
          echo "cargo install --locked --git https://github.com/${GITHUB_REPOSITORY} --tag ${GITHUB_REF_NAME}" >> body.md
          echo '```' >> body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=(--prerelease)
          if [ "${{ needs.validate-version.outputs.prerelease }}" != "true" ]; then
            release_flags=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file body.md \
            "${release_flags[@]}"
